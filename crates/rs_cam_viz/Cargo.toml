[package]
name = "rs_cam_viz"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rs_cam_gui"
path = "src/bin/main.rs"

[lints]
workspace = true

[dependencies]
rs_cam_core = { path = "../rs_cam_core", features = ["step"] }
eframe = { version = "0.34", features = ["wgpu"] }
egui = "0.34"
# G-LV.1: rs_cam owns the winit event loop (`host.rs`), so it needs winit's
# `ApplicationHandler` / `EventLoop` / `EventLoopProxy` types directly. Pinned
# and featured EXACTLY as eframe 0.34.3 declares it
# (`eframe-0.34.3/Cargo.toml:262-265`) so this adds no feature to the unified
# build and cannot resolve to a second, incompatible winit.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
egui-wgpu = "0.34"
egui_plot = "0.35"
nalgebra = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
rfd = "0.15"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
rmcp = { version = "1.3", features = ["server", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"], optional = true }
rs_cam_mcp = { path = "../rs_cam_mcp", optional = true }

[features]
default = ["mcp"]
mcp = ["dep:rmcp", "dep:tokio", "dep:rs_cam_mcp"]
