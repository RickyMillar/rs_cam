[package]
name = "rs_cam_mcp"
version = "0.1.0"
edition = "2021"
description = "Shared MCP parameter struct definitions for rs_cam — consumed by the GUI-embedded MCP server in rs_cam_viz."

[lib]
name = "rs_cam_mcp"
path = "src/lib.rs"

[dependencies]
rs_cam_core = { path = "../rs_cam_core" }
rmcp = { version = "1.3", features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
