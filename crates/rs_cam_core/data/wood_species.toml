# Wood species library — Janka hardness lookup for the parametric
# `Material::SolidWoodByJanka` variant. Surfaces species from the FPL Wood
# Handbook Ch.5 (peer-reviewed, 2010) and The Wood Database (cross-checked
# single-source), totalling ~130 species beyond the 10 first-class
# `WoodSpecies` enum variants.
#
# Dedup precedence: FPL wins when the same common name appears in both
# sources. Wood Database fills in species FPL Table 5-3a does not cover
# (typically tropical species). See
# `planning/feeds_data_ingest_phaseE_2026-05-31.md` for the dedup
# reconciliation table.
#
# Generated 2026-05-31 from
# `planning/data_ingest_2026-05-30/{fpl_ch5_extract,wood_database_species}.md`.
# Regenerate via the script captured in `phaseE_2026-05-31.md` if either
# source updates. Both `planning/` paths were deleted on 2026-09-17; the root
# `CLAUDE.md` gives the retrieval tag.
#
# Row order is the published order of each source: FPL first, Wood Database
# fill-ins second. `material/wood_species_library.rs` parses this file once
# and hands out the rows; it does not sort them.
#
# Columns
# * `display_name`    — common name as printed by the source.
# * `scientific_name` — binomial name; omit the key when the source has none.
# * `janka_lbf`       — Janka side hardness in lbf at 12% MC. An FPL row is
#                       converted from the published Newton value
#                       (`lbf = N / 4.448`, rounded to 1 decimal); a Wood
#                       Database row is quoted in lbf directly.
# * `specific_gravity_12` — FPL Table 5-3a specific gravity at 12% MC
#                       (footnote b: "based on weight when ovendry and
#                       volume at 12% moisture content"), transcribed from
#                       the SG column of `fpl_ch5_extract.md`. Only FPL rows
#                       carry it. Omit the key where FPL prints "—". The
#                       Curti 2021 force line reads it (ruling B6); a row
#                       without it has no force line.
# * `source_id`      — the per-row provenance column. It matches an entry in
#                       `data/vendor_lut/source_manifest.json`, and
#                       `wood_species_library_provenance` refuses a row whose
#                       `source_id` is not there.

