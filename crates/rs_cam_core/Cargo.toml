[package]
name = "rs_cam_core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core CAM library for 3-axis wood router toolpath generation"

[features]
default = ["parallel"]
parallel = ["rayon"]
step = ["truck-stepio", "truck-topology", "truck-meshalgo", "truck-geometry", "truck-polymesh"]
# Gates the twelve heaviest test binaries (the `[[test]]` sections at the
# bottom of this file). They were 75% of the 1,663 s serial rs_cam_core suite
# on the 2026-08-27 profile, so the dev loop neither compiles nor runs them.
# They are load-bearing sentries, NOT instruments: the commit gate and CI must
# pass `--features heavy-tests` (or `--features rs_cam_core/heavy-tests` from
# the workspace root) for both `cargo test` and `cargo clippy`.
heavy-tests = []
# Gates the three research arms in `finish/` — `conformal_spiral` (and its
# `conformal_spiral/` folder), `direction_field` and `spiral_finish_compact`.
# No product path calls them: they are measured candidates that lost their A/B
# (see `src/finish/CLAUDE.md`), and they are 7.4k lines, 22 % of that folder.
# Off by default, so a product build neither compiles nor lints them. The
# eight `[[test]]` sections below name the evidence harnesses that read them.
# Build and run one with, for example:
#   cargo test -p rs_cam_core --features research --test spiral_finish_compact_c1
# Most of their tests are `#[ignore]` evidence runs and need `-- --ignored`.
research = []

[dependencies]
nalgebra = { workspace = true }
stl_io = { workspace = true }
rayon = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = "1"
toml = { workspace = true }
geo = { workspace = true }
cavalier_contours = { workspace = true }
usvg = { workspace = true }
dxf = { workspace = true }
smallvec = { workspace = true }
truck-stepio = { version = "0.3", features = ["in"], optional = true }
truck-topology = { version = "0.6", optional = true }
truck-meshalgo = { version = "0.4", optional = true }
truck-geometry = { version = "0.5", optional = true }
truck-polymesh = { version = "0.6", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true

[dev-dependencies]
approx = "0.5"
# Test-only: lets probe harnesses read the generators' own `tracing::info!`
# telemetry (e.g. unified_finish's relink tallies) instead of re-deriving it
# from the emitted toolpath. Already a workspace dependency via the CLI/viz.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = { workspace = true }
csv = "1.3"
# Test-only: the M3 classification harness pins its own rayon thread pools so
# it can run a candidate at 1 thread and at N and diff the label grids
# exactly. The library already depends on rayon behind the `parallel` feature.
rayon = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[[bench]]
name = "perf_suite"
harness = false

# M3 classification-grid baseline + candidate arms.
[[bench]]
name = "classification"
harness = false

# Phase 0A baselines for planning/perf_review_2026-08-19/PERF_REVIEW.md —
# one bench per finding cluster, landed before any fix.
[[bench]]
name = "hot_paths"
harness = false

# The twelve heaviest test binaries, gated behind `heavy-tests` (see the
# comment on that feature). Naming a target explicitly does not disable
# autodiscovery of the rest of `tests/` — `autotests` stays true — so these
# sections add a required-features condition and change nothing else. The
# trailing comment on each is its 2026-08-27 serial wall-clock.
[[test]]
name = "feed_modulation_cycle_time_f036c" # 256 s
required-features = ["heavy-tests"]

[[test]]
name = "scallop_isofield_gouge_m4" # 237 s
required-features = ["heavy-tests"]

[[test]]
name = "scallop_candidates_m4" # 143 s
required-features = ["heavy-tests"]

[[test]]
name = "machine_kinematics_cycle_time_f034" # 91 s
required-features = ["heavy-tests"]

[[test]]
name = "offset_growth_m5" # 88 s
required-features = ["heavy-tests"]

[[test]]
name = "checkpoint_b_resolution_ab" # 86 s
required-features = ["heavy-tests"]

[[test]]
name = "scallop_oracle_validation_m4" # 79 s
required-features = ["heavy-tests"]

[[test]]
name = "air_cut_family_calibration_w5bf4" # 62 s
required-features = ["heavy-tests"]

[[test]]
name = "adaptive3d_planner_stock_xy_f027" # 58 s
required-features = ["heavy-tests"]

[[test]]
name = "offset_candidates_m5" # 54 s
required-features = ["heavy-tests"]

[[test]]
name = "adaptive3d_interior_cell_parity_f029" # 48 s
required-features = ["heavy-tests"]

[[test]]
name = "strategy_advisor_smoke" # 43 s
required-features = ["heavy-tests"]

# The research harnesses. Each one reads `finish::conformal_spiral`,
# `finish::direction_field` or `finish::spiral_finish_compact`, so each one
# needs the `research` feature to compile. The audit row FIN-01 listed six of
# them; `rg` found eight.
[[test]]
name = "graded_raster_e1"
required-features = ["research"]

[[test]]
name = "graded_raster_tier0_e2"
required-features = ["research"]

[[test]]
name = "banded_raster_costed_f2"
required-features = ["research"]

[[test]]
name = "valley_branch_falsifier_h1"
required-features = ["research"]

[[test]]
name = "direction_field_wanaka_f1"
required-features = ["research"]

[[test]]
name = "conformal_spiral_synthetic_f2"
required-features = ["research"]

[[test]]
name = "spiral_finish_compact_c1"
required-features = ["research"]

[[test]]
name = "whole_board_spiral_ledger_g1"
required-features = ["research"]
