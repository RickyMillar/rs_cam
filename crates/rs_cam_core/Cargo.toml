[package]
name = "rs_cam_core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core CAM library for 3-axis wood router toolpath generation"

[features]
default = ["parallel"]
parallel = ["rayon"]
step = ["truck-stepio", "truck-topology", "truck-meshalgo"]
# Gates the twelve heaviest test binaries, and one set of research tables
# that is not heavy but is not a gate either (the `[[test]]` sections at the
# bottom of this file). They were 75% of the 1,663 s serial rs_cam_core suite
# on the 2026-08-27 profile, so the dev loop neither compiles nor runs them.
# They are load-bearing sentries, NOT instruments: the commit gate must
# pass `--features heavy-tests,test-support` (or the `rs_cam_core/` forms from
# the workspace root) for both `cargo test` and `cargo clippy`: five heavy
# binaries also bind a `test-support` door (F085).
heavy-tests = []
# Gates the three research arms in `finish/` — `conformal_spiral` (and its
# `conformal_spiral/` folder), `direction_field` and `spiral_finish_compact`.
# No product path calls them: they are measured candidates that lost their A/B
# (see `src/finish/CLAUDE.md`), and they are 7.4k lines, 22 % of that folder.
# Off by default, so a product build neither compiles nor lints them. The
# eight `[[test]]` sections below name the evidence harnesses that read them.
# Build and run one with, for example:
#   cargo test -p rs_cam_core --features research,test-support --test spiral_finish_compact_c1
# (five research harnesses also read `metrology`, behind `test-support`).
# Most of their tests are `#[ignore]` evidence runs and need `-- --ignored`.
research = []
# Gates the twenty-four test doors in `maps/` and `surface/` — the four
# cache-stats types with their four `stats()` readers, the same four caches'
# `reset_stats`, `cache_len` and `clear`, `reach_map_for_mesh`,
# `reset_drop_call_count`, `TierMap::label_at` and `GridZ::is_covered`. No
# product path reads any of them, and each one is bound by an integration-test
# crate, so `cfg(test)` cannot hide them. Off by default, so the default
# public API of this crate carries no test door. The eight `[[test]]` sections
# below name the harnesses that bind them, and `rs_cam_viz` enables the
# feature from its `[dev-dependencies]` for `tests/reach_overlay_p5.rs`.
# F085 (2026-10-20) adds the other test doors: the `metrology/` module,
# `mesh::make_test_flat` / `make_test_hemisphere`, the F-029 planner probe,
# `fed_moves_outside_region`, `Polygon2::with_holes_closed`,
# `dexel_stock_to_top_surface_mesh`, the composite-render doors, three
# `flow_accum` doors, `drop_call_count` and `planned_tier_boundary_polys`.
# Run one with, for example:
#   cargo test -p rs_cam_core --features test-support --test reach_map_p5
test-support = []

[dependencies]
rs_cam_derive = { path = "../rs_cam_derive" }
nalgebra = { workspace = true }
stl_io = { workspace = true }
rayon = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = "1"
toml = { workspace = true }
geo = { workspace = true }
cavalier_contours = { workspace = true }
usvg = { workspace = true }
dxf = { workspace = true }
smallvec = { workspace = true }
truck-stepio = { version = "0.3", features = ["in"], optional = true }
truck-topology = { version = "0.6", optional = true }
truck-meshalgo = { version = "0.4", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
# The memory budget (`src/budget/`). `memory-stats` reads the process
# resident size (`memory_stats::memory_stats()`); `sysinfo` reads the total
# system memory (`System::new`, `refresh_memory`, `total_memory`), and only
# its `system` feature is needed.
memory-stats = "1.2.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[lints]
workspace = true

[dev-dependencies]
approx = "0.5"
# Test-only: lets probe harnesses read the generators' own `tracing::info!`
# telemetry (e.g. unified_finish's relink tallies) instead of re-deriving it
# from the emitted toolpath. Already a workspace dependency via the CLI/viz.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = { workspace = true }
csv = "1.3"
# Test-only: the M3 classification harness pins its own rayon thread pools so
# it can run a candidate at 1 thread and at N and diff the label grids
# exactly. The library already depends on rayon behind the `parallel` feature.
rayon = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
# Every test, bench and example build of this crate turns `test-support` on
# through this self dev-dependency, so a named sentry runs with no feature
# flag. The library build itself (and every crate that depends on it) does
# not export the test doors (F085).
rs_cam_core = { path = ".", features = ["test-support"] }

[[bench]]
name = "perf_suite"
harness = false
# Reads `make_test_hemisphere` and `dexel_stock_to_top_surface_mesh`, two
# test doors behind `test-support` (F085).
required-features = ["test-support"]

# M3 classification-grid baseline + candidate arms.
[[bench]]
name = "classification"
harness = false

# Phase 0A baselines for planning/perf_review_2026-08-19/PERF_REVIEW.md —
# one bench per finding cluster, landed before any fix.
[[bench]]
name = "hot_paths"
harness = false

# The twelve heaviest test binaries plus one research table set, gated
# behind `heavy-tests` (see the
# comment on that feature). Naming a target explicitly does not disable
# autodiscovery of the rest of `tests/` — `autotests` stays true — so these
# sections add a required-features condition and change nothing else. The
# trailing comment on each is its 2026-08-27 serial wall-clock.
[[test]]
