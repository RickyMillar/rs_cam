notes = "ADDED 2026-08-13 by the S-2 /refresh-lit-matrix run, for Checkpoint K-(e1). Retrieved and read in full. This is already the provenance of the bundled LUT rows in data/vendor_lut/observations/freud_solid_carbide.json; it is now also a literature-matrix source, so the matrix and the LUT cite the same document by name. Two tables: 'CHIP LOADS FOR FREUD SOLID CARBIDE ROUTER BITS ONLY' (1/8, 1/4, 3/8, 1/2 in) and one for carbide-tipped straight and profile bits (1/8 through 3/4 in), both 'based on cut depth equal to bit diameter'. SOLID CARBIDE 1/8in (3.175 mm) row: hardwood .002-.005 in = 0.0508-0.1270 mm/tooth, softwood .004-.006 in = 0.1016-0.1524 mm/tooth, plywood .003-.005 in, MDF/particle board .004-.007 in. That hardwood pair is exactly the shipped LUT row freud-solid-carbide-eighth-hardwood (0.0508 / 0.127). Prints 'Chip Load = Feed Rate / (RPM x number of flutes)' plus three worked examples, which is what makes the column an advance per tooth rather than a chip thickness. Depth rule, verbatim: 'If Cut Depth is 2X the bit diameter, reduce the Chip Load by at least 25% / If Cut Depth is 3X the bit diameter, reduce the Chip Load by at least 50%' - identical in form to the Onsrud rule, so the reduction is doubly attested. Self-qualified verbatim as 'a recommended starting point and does not warranty against tool breakage'."

