covers = ["flat", "ball", "vbit"]
ops = ["pocket", "profile", "adaptive2d", "vcarve"]
materials = ["hardwood", "softwood", "plywood"]
notes = "De-facto wood-router standard. Industrial spindle assumed; apply hobby derate. NUMBERS RE-READ IN FULL 2026-08-13 (S-2 refresh; see planning/review_2026-08-08/LIT_MATRIX_REFRESH_S2.md). The chart is 'Recommended Chip Load per Tooth by Cutting Diameter (in)', 38 series rows across 21 diameter columns, and prints 'FORMULAS: Chip Load = Feed Rate / (RPM x # of cutting edges)'. Ten series carry a 1/8in (3.175 mm) entry; that whole column spans .002-.012 in/tooth = 0.0508-0.3048 mm/tooth. The chart's own APPLICATION guide names 52-200/57-200 as the GOOD choice for both Single Pass and Roughing, and its 1/8in value is .003-.005 in = 0.0762-0.1270 mm/tooth; the lowest 1/8in entry of any series (52-700 and 64-000/65-000) is .002-.004 in = 0.0508-0.1016 mm/tooth. Consequence for cells: this chart cannot support a Ø3 mm hardwood feed-per-tooth band below 0.0508 mm/tooth, and the Ipe cell's old 0.013-0.027 band cited it wrongly (Checkpoint K-(e1), fixed 2026-08-13). Its only depth-related rule is a CHIP-LOAD reduction keyed to depth of cut - see onsrud_doc_rule."

