[dapra_rctf]
name = "DAPRA Corporation - Radial Chip Thinning: How to Max Out Your Milling Tool Feed Rate"
citation_url = "https://www.dapra.com/articles/radial-chip-thinning"
authority_tier = "gold"
last_verified = "2026-08-13"
url_verified = "2026-08-13"
covers = ["flat", "bull"]
ops = ["adaptive2d", "pocket"]
materials = ["all"]
notes = "Closed-form chip-thinning correction RCTF = D / (2 * sqrt(ae * (D - ae))) for ae < D/2. Cells that pin a small WOC compare effective chipload after RCTF against the rubbing floor. URL REPLACED 2026-08-13 (S-2 refresh): this row is NAMED for DAPRA but pointed at https://www.kennametal.com/us/en/resources/calculators.html, which is a hard 404 - one of the three rows sharing that dead URL. It now cites its own publisher. The row's gold tier is now EARNED rather than asserted, on two independent checks. (1) ALGEBRAIC: the stored closed form is identical to DAPRA's published form 1 / sqrt(1 - (1 - 2*ae/D)^2), verified to a maximum deviation of 4.4e-16 across ae/D in {0.05, 0.10, 0.20, 0.35, 0.49}. (2) NUMERICAL, against DAPRA's own printed multiplier chart: at 35% WOC the formula gives 1.0483 vs a published 1.05; at 10% it gives 1.6667 vs 1.70; at 5% it gives 2.2942 vs 2.30 - agreement within 2.0% at the worst point and within 0.25% at the other two, the residual being DAPRA's rounding. Stated condition of applicability, verbatim: 'If you're milling at less than 50% of your cutting tool diameter without leveraging' chip thinning, productivity is being left on the table. This key carries 38 citations."

