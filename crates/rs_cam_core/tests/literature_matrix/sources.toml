[onsrud_hwood]
name = "LMT Onsrud - Hard Wood Cutting Data Recommendations (PCT-19 p.115)"
citation_url = "https://www.onsrud.com/images/Hard%20Wood.pdf"
authority_tier = "gold"
last_verified = "2026-08-13"
