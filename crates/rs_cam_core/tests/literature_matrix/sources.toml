notes = "Drill Cutting Data Recommendations (page 124 of the PCT-19 catalogue). Contains chip load per tooth by cutting diameter for series 72-000 Wood (0.009-0.017 in/tooth, D3-8 mm), 70-500 Plastic and four composite series; gang drills footnoted at 4,500 RPM / 150 IPM; RPM and feedrate formulas. It contains NO peck guidance, NO hole-depth guidance and NO depth-to-diameter guidance — a case-insensitive search for `peck` / `hole depth` returns zero hits (W6 audit 2026-08-04, item R-13). The previous note claimed 'drill IPR / peck guidance' and the previous URL was a hard 404. Plunge feed is the same as drill feed (vertical-only kinematics)."

