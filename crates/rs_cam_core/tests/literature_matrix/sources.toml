[dapra_rctf]
name = "DAPRA / Kennametal — Radial Chip-Thinning Factor (RCTF)"
citation_url = "https://www.kennametal.com/us/en/resources/calculators.html"
authority_tier = "gold"
last_verified = "2026-06-03"
covers = ["flat", "bull"]
ops = ["adaptive2d", "pocket"]
materials = ["all"]
notes = "Closed-form chip-thinning correction RCTF = D / (2 × sqrt(ae × (D - ae))) for ae < D/2 (Kennametal/DAPRA notation). Cells that pin a small WOC compare effective chipload after RCTF against the rubbing floor."

