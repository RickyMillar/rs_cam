janka_lbf = 1450
machine_class = "shapeoko_xxl"
scallop_height_mm = 0.05

[cell.expected.rpm]
min = 18000
max = 22000
mode = "band"
unit = "rpm"
sources = ["onsrud_hwood", "amana_spektra", "gwizard_hwood"]

[cell.expected.feed_per_tooth]
min = 0.035
max = 0.070
mode = "band"
unit = "mm/tooth"
hobby_derate = 0.7
sources = ["onsrud_hwood", "cutter_shop", "vectric_default"]

[cell.expected.radial_woc]
min = 0.98
max = 1.20
mode = "band"
unit = "mm"
sources = ["onsrud_hwood", "vectric_default", "shapeoko_wiki"]

[cell.expected.axial_doc]
min = 0.0
max = 0.0
mode = "na"
unit = "mm"
sources = ["onsrud_hwood", "vectric_default", "shapeoko_wiki"]

[cell.expected.plunge_feed]
