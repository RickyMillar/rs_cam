[[cell]]
id = "flat_6mm_scallop_oak_unusable"
category = "wrong-tool"
description = "6mm FLAT endmill assigned to a SCALLOP toolpath — scallop math requires a curved tip"
rationale = "Scallop height = R - sqrt(R^2 - (stepover/2)^2) is undefined for a flat tool (R = infinity, equivalently no spherical cap). Engine MUST refuse. If it silently produces values, that's a critical schema/routing bug."
profile_tag = "either"

[cell.inputs]
tool_class = "flat"
diameter_mm = 6.0
flute_count = 2
flute_length_mm = 22.0
stickout_mm = 25.0
operation = "scallop"
material = "oak_red"
material_class = "hardwood"
janka_lbf = 1290
machine_class = "shapeoko_xxl"
scallop_height_mm = 0.02

[cell.fixed_inputs]
woc_mm = "free"
doc_mm = "free"

[[cell.invariants]]
name = "scallop_requires_curved_tip"
expr = "feed_rate / (rpm * flutes)"
floor = 0.025
sources = ["shaw_metal_cutting", "shaw_chipload"]
unit = "mm/tooth"
severity_on_fail = "critical"

[[cell.anti_patterns]]
name = "non_curved_tool_for_scallop"
expr = "rpm > 0"
