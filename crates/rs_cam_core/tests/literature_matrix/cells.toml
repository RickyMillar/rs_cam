sources = ["onsrud_hwood", "amana_spektra", "gwizard_hwood"]

[cell.expected.axial_doc]
min = 0.3
max = 1.8
mode = "ceiling"
unit = "mm"
hobby_derate = 0.5
sources = ["onsrud_hwood", "shapeoko_wiki", "amana_spektra"]

[cell.expected.radial_woc]
min = 0.6
max = 1.8
mode = "band"
unit = "mm"
sources = ["dapra_rctf", "amana_spektra", "onsrud_doc_rule"]

[cell.expected.plunge_feed]
min_fraction_of_feed = 0.20
max_fraction_of_feed = 0.50
mode = "fraction"
sources = ["shapeoko_wiki", "vectric_default", "onsrud_hwood"]

[[cell.invariants]]
