[[cell]]
id = "flat_6mm_adaptive2d_birchply"
category = "normal-use"
description = "6mm 2F flat in baltic birch plywood, adaptive2d roughing at low WOC"
rationale = "RCTF chip-thinning at woc/d=0.10 — engine must compensate fpt upward; catches flat (non-RCTF) chipload bugs and deep-DOC envelope violations"
profile_tag = "either"

[cell.inputs]
tool_class = "flat"
diameter_mm = 6.0
flute_count = 2
flute_length_mm = 22.0
stickout_mm = 25.0
operation = "adaptive2d"
material = "baltic_birch"
material_class = "plywood"
machine_class = "shapeoko_xxl"

[cell.fixed_inputs]
woc_mm = 0.6
doc_mm = "free"

[cell.expected.rpm]
min = 16000
max = 20000
mode = "band"
unit = "rpm"
sources = ["onsrud_plywood", "amana_spektra", "gwizard_plywood"]

[cell.expected.feed_per_tooth]
min = 0.034
max = 0.093
mode = "band"
unit = "mm/tooth"
hobby_derate = 0.7
sources = ["onsrud_plywood", "dapra_rctf", "gwizard_plywood"]

# axial_doc band widened to 9.0 (1.5×D) per three-source rule:
#   - dapra_rctf: low-WOC adaptive guidance permits axial DOC up to
#     ~1.5-2.0×D when ae < D/4 (RCTF chip-thinning offsets edge load).
#   - amana_spektra: Spektra adaptive plunge-depth recommendations cite
#     1.0-1.5×D for woc/d < 0.20 in plywood/MDF.
#   - onsrud_doc_rule: 1.5-4.5×D pre-derate; with hobby_derate=0.5
#     the floor of that band is 0.75×D and the ceiling 2.25×D, so 1.5×D
#     sits comfortably within. The engine emits adaptive_doc_factor×D
#     = 1.5×6 = 9 mm; this is the canonical adaptive value.
[cell.expected.axial_doc]
min = 4.0
max = 9.0
mode = "band"
unit = "mm"
hobby_derate = 0.5
sources = ["onsrud_doc_rule", "dapra_rctf", "amana_spektra"]

[cell.expected.radial_woc]
min = 0.6
max = 1.0
mode = "band"
unit = "mm"
sources = ["dapra_rctf", "amana_spektra", "shapeoko_wiki"]

[cell.expected.plunge_feed]
min_fraction_of_feed = 0.30
max_fraction_of_feed = 0.50
mode = "fraction"
sources = ["shapeoko_wiki", "vectric_default"]

[[cell.invariants]]
name = "rctf_compensation_applied"
expr = "feed_rate / (rpm * flutes)"
floor = 0.048
unit = "mm/tooth"
sources = ["dapra_rctf"]
severity_on_fail = "moderate"

[[cell.invariants]]
name = "chipload_above_rubbing_floor"
expr = "feed_rate / (rpm * flutes)"
floor = 0.025
unit = "mm/tooth"
sources = ["shaw_metal_cutting"]
severity_on_fail = "critical"

[[cell.invariants]]
name = "mrr_under_power"
expr = "doc * woc * feed_rate / 60000"
ceiling = 0.24
unit = "cm^3/s"
sources = ["fpl_wood_handbook", "shaw_chipload"]
severity_on_fail = "moderate"

[[cell.invariants]]
name = "envelope_adaptive2d"
type = "convex_hull"
vars = ["woc_over_d", "doc_over_d"]
vertices = [[0.05, 0.50], [0.20, 0.50], [0.20, 1.50], [0.05, 1.50]]
sources = ["dapra_rctf", "amana_spektra"]
severity_on_fail = "minor"

[[cell.anti_patterns]]
name = "chipload_below_rubbing_floor"
expr = "feed_rate / (rpm * flutes) < 0.025"
severity = "critical"

[[cell.anti_patterns]]
name = "adaptive_shallow_doc_pocket_style"
expr = "doc_over_d < 0.4"
severity = "moderate"


[[cell]]
