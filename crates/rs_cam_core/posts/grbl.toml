# GRBL 1.1+ post-processor.
#
# Verified by `gcode_emitter_parity` (side-by-side vs old trait) and by
# the captured-fixtures check under `planning/gcode_current_outputs/`.

name = "GRBL"
wcs = "G54"

# Preamble: header comment, modal defaults, WCS, spindle on at requested
# RPM. Trailing `\` on the opening `"""` line eats the leading newline so
# the rendered string starts with `(Generated by rs_cam)`.
#
# `{wcs_line}` expands to "G54\n" (from `wcs` above). GRBL powers on in
# G54 by default, but emitting it explicitly is defensive: if the
# controller was left in G55–G59 by a prior program, an implicit-WCS
# job would run against the wrong work offset. Matches grblHAL / the
# LinuxCNC + Mach3 convention.
preamble = """\
(Generated by rs_cam)
G17 {units_word} G90 G40 G49 G80
{wcs_line}M3 S{spindle_rpm}
"""

# Postamble: spindle off, retract to safe Z (literal value, not a
# parameter — matches legacy behaviour), program end.
postamble = """\
M5
G0 Z10.000
M30
"""

# Program pause used by multi-setup boundaries: spindle off, message,
# pause-for-operator. `{message_comment}` is filled by the emitter using
# this post's comment style.
program_pause = """\
M5
{message_comment}
M0
"""

# Tool change: vanilla Grbl 1.1 rejects M6 (error:20), so a tool
# change is a manual operation — spindle off, operator message, M0
# pause. The `M3 S{rpm}` the program builder emits right after the
# change doubles as the resume spin-up.
tool_change = """\
M5
{message_comment}
M0
"""

# Grbl 1.1 lacks tool change (M6), mist coolant (M7) and cutter
# compensation (G40/G41/G42). Without these guards, user pre/post
# snippets that emit M6/M7 or comp toggles fail at the controller.
unsupported_mcodes = [6, 7]
supports_cutter_comp = false

# Linearise sub-0.05mm arcs into chords — Grbl 1.1 rejects them
# outright with "arc trajectory inconsistent" otherwise.
[arc_linearize]
enabled = true
threshold_mm = 0.05

[decimals]
xyz = 3
feed = 0
ijk = 3

[comment]
format = "({text})"
