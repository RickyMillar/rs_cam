# grblHAL post-processor.
#
# Every grblHAL claim below cites grblHAL/core@c3a887e as file:line.
#
# grblHAL accepts the Grbl 1.1 word set and adds to it. The differences
# this post uses:
#
# - The board runs the tool change (operator ruling 2026-10-08): the
#   post writes `M6 T<n>`. With `$341=3` the board stops the spindle and
#   the coolant (tool_change.c:474-476), moves Z to home
#   (tool_change.c:171-182), waits for cycle start, probes the new tool
#   at the G59.3 position and sets the tool length offset
#   (tool_change.c:283-356). `$341=4` makes the board ignore M6
#   (gcode.c:1838, gcode.c:4144-4147): the program then runs on with the
#   old tool. The export warns when the machine profile says `$341=4`.
# - Operator messages use `(MSG,<text>)`. The parser sends the text to
#   the sender (gcode.c:1139-1150). Grbl 1.1 has no MSG (its gcode.c:387).
# - M7 (mist) is refused when the board has no mist output
#   (gcode.c:1855-1856: `RETURN(Status_GcodeUnsupportedCommand)`). So M7
#   is unsupported by default. The export option "mist output present"
#   removes it from the list.
# - A line holds 256 characters, comments and spaces included
#   (protocol.h:36, protocol.c:328). Grbl 1.1 holds 79.
# - An `M0` pause is a feed hold (gcode.c:4979-4981), and `$J=` jog is
#   refused in that state (system.c:239-242). The operator cannot jog to
#   re-zero during a setup pause. A two-sided job therefore exports one
#   file per setup by default on grblHAL.
#
# Explicit `G54` in the preamble: if the controller was left in G55-G59
# by a prior program, an implicit-WCS job would run on the wrong origin.

name = "grblHAL"
wcs = "G54"
units = "mm"

# Preamble: header comment, modal defaults, WCS, spindle on. The
# `{wcs_line}` token expands to "G54\n" because of the `wcs = "G54"`
# field above.
#
# `{first_tool_change}` writes `M5`, the MSG and `M6 T<first tool>` before
# the first spindle start, in EVERY file (each per-setup file too).
# grblHAL clears the tool length reference at homing (tool_change.c:62);
# the first probe after homing sets it, and each later M6 applies the
# difference (tool_change.c:339-346). So the first tool must be probed
# before the operator zeroes Z with it. When the controller already holds
# that tool, it skips the M6 (tool_change.c:433-434, gcode.c:2613-2615).
# The token writes nothing when the tool change is a pause.
preamble = """\
(Generated by rs_cam)
G17 {units_word} G90 G40 G49 G80
{wcs_line}{first_tool_change}M3 S{spindle_rpm}
"""

# Postamble: spindle off, program end. The safe-Z retract is emitted by
# the program builder (rapid to the highest Z the program used) just
# before this block — see the Grbl post for the C2 rationale.
postamble = """\
M5
M30
"""

# Program pause used by multi-setup boundaries in a single-file export.
# The first message says why a single file is a poor fit (see the M0
# note above); the second names the setup.
program_pause = """\
M5
(MSG,M0 hold: no jog. To re-zero, export one file per setup.)
{message_comment}
M0
"""

# Tool change: the board runs it (see above). The program builder writes
# a safe-Z retract before this block and `M3 S<rpm>` after it.
tool_change = """\
M5
{message_comment}
M6 T{tool_number}
"""

# Operator messages (tool change, setup pause) as grblHAL MSG comments.
message_format = "(MSG,{text})"

# M7 needs a mist output on the board (gcode.c:1855-1856). The export
# option "mist output present" removes 7 from this list.
unsupported_mcodes = [7]
mist_option = true

# Cutter compensation: CUTTER_COMP_ENABLE is a build option
# (gcode.c:1649-1660) and the hobby builds do not set it. The export
# refuses a profile with compensation "In Control" on this post (G1).
supports_cutter_comp = false

# A two-sided job exports one file per setup by default (see the M0 note
# above). The export dialog, MCP `export_gcode` and the CLI read this.
prefer_one_file_per_setup = true

# The board runs G81/G82/G83 canned cycles (gcode.c:1606-1613,
# motion_control.c:542-635). The export writes them only with the option
# "native drill cycles" (default off). See G7 in the export code.
canned_drill_cycles = true

[arc_linearize]
enabled = true
threshold_mm = 0.05

[decimals]
xyz = 3
feed = 0
ijk = 3

[comment]
format = "({text})"
