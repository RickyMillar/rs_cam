# Mach3 (mill) post-processor.
#
# Mirrors the legacy `Mach3Post` Rust impl byte-for-byte.

name = "Mach3"
wcs = "G54"

# Mach3 quirks: omits `G49` from modal defaults (the legacy impl does);
# inserts `G4 P2` after spindle-on so the spindle has time to spin up
# before the first cutting move.
#
# `{wcs_line}` expands to "G54\n" (A5, 2026-06-11): the post previously
# emitted no WCS at all — the wizard's WCS override no-op'd and every
# export ran in whatever WCS the controller last had active.
preamble = """\
(Generated by rs_cam)
G17 {units_word} G90 G40 G80
{wcs_line}M3 S{spindle_rpm}
G4 P2
"""

# Postamble: spindle off, then `G28 G91 Z0` to send the Z axis home
# before program end (Mach3 convention). The safe-Z retract is emitted
# by the program builder (max program Z) just before this block — see
# the Grbl post for the C2 rationale. `G90` restores absolute mode
# after the incremental `G28 G91 Z0` so a following program / MDI move
# doesn't inherit G91.
postamble = """\
M5
G28 G91 Z0
G90
M30
"""

program_pause = """\
M5
{message_comment}
M0
"""

# Tool change: Mach3 implements M6 natively (tool-change macro hooks).
tool_change = """\
M5
M6 T{tool_number}
"""

# Mach3 supports mist coolant (M7) and cutter compensation
# (G41/G42). supports_cutter_comp defaults to true.

[arc_linearize]
enabled = true
threshold_mm = 0.05

[decimals]
xyz = 4
feed = 1
ijk = 4

[comment]
format = "({text})"
