<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geometry Tab Mockup</title>
<style>
:root {
  --bg: #1b1f24;
  --panel: #252a30;
  --panel-2: #2d333a;
  --sunken: #15181c;
  --line: #3a414a;
  --text: #d6dce2;
  --strong: #eef1f4;
  --muted: #8a949e;
  --accent: #5b9dd9;
  --accent-tint: rgba(91,157,217,0.18);
  --ok: #5fbf7a;
  --island: #5b9dd9;
  --caution: #e0a83c;
  --danger: #e87b77;
  --idle: #737c87;
  --off: #454d56;
  --face: #6b7682;
  --pick: #c58df0;
  --floor: #e0a83c;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef1f4;
    --panel: #ffffff;
    --panel-2: #f3f5f7;
    --sunken: #e2e6ea;
    --line: #cfd5db;
    --text: #27303a;
    --strong: #0f151b;
    --muted: #66717c;
    --accent: #2f78c4;
    --accent-tint: rgba(47,120,196,0.14);
    --ok: #2f9a52;
    --island: #2f78c4;
    --caution: #b97a12;
    --danger: #c9443f;
    --idle: #8d97a1;
    --off: #c3cad1;
    --face: #9aa5b0;
    --pick: #8a4fc0;
    --floor: #b97a12;
  }
}
:root[data-theme="light"] {
  --bg: #eef1f4; --panel: #ffffff; --panel-2: #f3f5f7; --sunken: #e2e6ea; --line: #cfd5db;
  --text: #27303a; --strong: #0f151b; --muted: #66717c; --accent: #2f78c4;
  --accent-tint: rgba(47,120,196,0.14); --ok: #2f9a52; --island: #2f78c4; --caution: #b97a12;
  --danger: #c9443f; --idle: #8d97a1; --off: #c3cad1; --face: #9aa5b0; --pick: #8a4fc0; --floor: #b97a12;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { display: flex; flex-direction: column; height: 100vh; min-height: 640px; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; color: var(--strong); font-weight: 600; }
.blurb { color: var(--muted); flex: 1 1 300px; min-width: 0; }
.wsbar { display: flex; gap: 0; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.wsbar span { padding: 6px 14px; color: var(--muted); border-bottom: 2px solid transparent; }
.wsbar span.on { color: var(--strong); border-bottom-color: var(--accent); }
main { display: grid; grid-template-columns: 220px minmax(0,1fr) 380px; flex: 1; min-height: 0; }
aside, section.view { min-width: 0; overflow: auto; }
aside { background: var(--panel); padding: 10px 12px; }
aside.left { border-right: 1px solid var(--line); }
aside.right { border-left: 1px solid var(--line); }
h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  margin: 12px 0 6px; font-weight: 600; }
h2:first-child { margin-top: 2px; }
.row { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 4px; cursor: pointer;
  user-select: none; min-height: 24px; }
.row:hover, .row.hover { background: var(--panel-2); }
.row.sel { background: var(--accent-tint); }
.row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .tag { font-size: 11px; color: var(--muted); white-space: nowrap; }
.row .st { font-size: 11px; white-space: nowrap; }
.row.more { color: var(--accent); font-size: 12px; }
.grp { font-weight: 600; color: var(--strong); }
.grp .caret { width: 10px; color: var(--muted); }
.ind { padding-left: 22px; }
.offers { margin: 2px 0 4px 22px; padding: 4px; border: 1px solid var(--accent); border-radius: 6px; background: var(--panel); }
.offers .row { font-size: 12px; }
.sw { width: 10px; height: 10px; border-radius: 2px; flex: none; border: 1px solid var(--line); }
.btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 4px;
  padding: 3px 9px; font: inherit; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.mini { padding: 0 6px; font-size: 11px; line-height: 18px; }
.btn.x { padding: 0 5px; font-size: 11px; line-height: 18px; color: var(--muted); }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 6px 0; }
.kv { display: grid; grid-template-columns: 76px 1fr; gap: 2px 8px; }
.kv b { color: var(--muted); font-weight: 500; }
.note { color: var(--muted); font-size: 12px; }
.notes div { margin: 2px 0; }
.ok { color: var(--ok); } .cau { color: var(--caution); } .dan { color: var(--danger); } .acc { color: var(--accent); }
.actions { display: flex; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--line); margin: 8px 0 6px; }
.tabs button { background: transparent; color: var(--muted); border: 0; border-bottom: 2px solid transparent;
  padding: 5px 8px; font: inherit; font-size: 12px; cursor: pointer; }
.tabs button.on { color: var(--strong); border-bottom-color: var(--accent); }
.tabs button.new::after { content: " new"; color: var(--accent); font-size: 10px; }
.ophead { display: flex; align-items: center; gap: 8px; }
.ophead b { color: var(--strong); font-size: 14px; flex: 1; }
section.view { position: relative; background: var(--sunken); display: flex; flex-direction: column; }
.pickbar { display: flex; gap: 6px; align-items: center; justify-content: center; padding: 8px; flex-wrap: wrap; min-height: 40px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 12px;
  padding: 2px 10px; cursor: pointer; font: inherit; font-size: 12px; }
.chip.on { border-color: var(--accent); color: var(--strong); background: var(--accent-tint); }
.chip.dis { color: var(--off); border-style: dashed; cursor: not-allowed; }
svg { flex: 1; width: 100%; min-height: 0; display: block; }
.status { padding: 6px 12px; border-top: 1px solid var(--line); background: var(--panel); min-height: 30px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 4px 12px 8px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
footer { padding: 4px 16px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); background: var(--panel); }
footer .bad { color: var(--danger); }
.chooser { position: absolute; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px;
  padding: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.35); z-index: 5; min-width: 240px; }
.chooser .row { padding: 4px 6px; }
input[type=search] { background: var(--sunken); color: var(--text); border: 1px solid var(--line); border-radius: 4px;
  padding: 3px 6px; font: inherit; width: 100%; }
@media (max-width: 900px) {
  body { height: auto; }
  main { grid-template-columns: minmax(0,1fr); }
  aside.left, aside.right { border: 0; border-top: 1px solid var(--line); }
  section.view { min-height: 360px; }
  .wsbar { overflow-x: auto; padding: 0 16px; }
  header { padding: 10px 16px; }
}

/* viewport item styles */
g.it .vis { vector-effect: non-scaling-stroke; }
g.it .hit { fill: none; stroke: transparent; stroke-width: 2.4; pointer-events: stroke; cursor: pointer; }
g.it.k-face .hit { fill: transparent; stroke: none; pointer-events: fill; }
g.it.k-circle .hit { fill: transparent; pointer-events: all; }
g.it.nopick .hit { pointer-events: none; cursor: default; }
g.it.k-face .vis { fill: var(--face); fill-opacity: .16; stroke: none; }
g.it.k-ring .vis, g.it.k-edge .vis, g.it.k-circle .vis { fill: none; stroke: var(--idle); stroke-width: 1.4; }
g.it.k-edge .vis { stroke-width: 2.4; stroke-dasharray: 6 3; }
g.it.k-point .vis { fill: var(--idle); stroke: none; }
g.it.s-off .vis { opacity: .35; }
g.it.k-face.s-cut .vis { fill: var(--ok); fill-opacity: .32; }
g.it.k-face.s-floor .vis { fill: var(--floor); fill-opacity: .30; }
g.it.s-cut:not(.k-face) .vis { stroke: var(--ok); stroke-width: 2.2; }
g.it.s-island:not(.k-face) .vis { stroke: var(--island); stroke-width: 2.2; }
g.it.k-point.s-cut .vis { fill: var(--ok); }
g.it.hov:not(.k-face) .vis { stroke: var(--strong); stroke-width: 3; }
g.it.k-point.hov .vis { fill: var(--strong); }
g.it.k-face.hov .vis { fill-opacity: .5; }
.zlab { fill: var(--muted); font-size: 2.6px; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>Geometry tab, revision 2</h1>
  <div class="blurb">A tab of the toolpath inspector. It lists the selected items only. Pick in the viewport.</div>
  <button class="btn mini" id="themeBtn" title="Change the colour theme">Theme: auto</button>
</header>
<div class="wsbar">
  <span>Setup</span><span class="on">Toolpaths</span><span>Simulation</span><span>Readiness</span>
</div>
<main>
  <aside class="left" id="left"></aside>
  <section class="view">
    <div class="pickbar" id="pickbar"></div>
    <svg id="svg" viewBox="-12 -12 146 106" preserveAspectRatio="xMidYMid meet" aria-label="Top view of a stepped block"></svg>
    <div class="legend" id="legend"></div>
    <div class="status" id="status"></div>
  </section>
  <aside class="right" id="right"></aside>
</main>
<footer id="selfcheck"></footer>

<script>
"use strict";
/* ---------- The model: a stepped block, seen from the top ----------
   Top face Z 32 (x 0..60), with a pocket (x 15..45, y 25..55) whose floor is Z 24.
   Step face Z 20 (x 60..120), with a grid of 24 holes of 6 mm and one hole of 10 mm.
   These are the items that UX-7 gives a STEP model.
   Mockup simplification: a hole boundary is a circle item only, not also a face ring.
   UX-7 decides this. */
const HOLES6 = [];
[66, 74, 82, 90].forEach(x => [8, 21, 34, 47, 60, 73].forEach(y => HOLES6.push([x, y])));
const HOLE10 = [106, 40];
function circlePath(x, y, r) { return `M${x - r} ${y} a${r} ${r} 0 1 0 ${2 * r} 0 a${r} ${r} 0 1 0 ${-2 * r} 0`; }
const ITEMS = [
  { id: "F1", kind: "face",   name: "Top face",          z: 32, d: "M0 0 H60 V80 H0 Z M15 25 V55 H45 V25 Z", box: [0,0,60,80] },
  { id: "F3", kind: "face",   name: "Pocket floor",      z: 24, d: "M15 25 H45 V55 H15 Z", box: [15,25,45,55] },
  { id: "F2", kind: "face",   name: "Step face",         z: 20,
    d: "M60 0 H120 V80 H60 Z " + HOLES6.map(([x, y]) => circlePath(x, y, 3)).join(" ") + " " + circlePath(HOLE10[0], HOLE10[1], 5),
    box: [60,0,120,80] },
  { id: "R1", kind: "ring",   name: "Top face outline",  z: 32, d: "M0 0 H60 V80 H0 Z", box: [0,0,60,80] },
  { id: "R2", kind: "ring",   name: "Pocket rim",        z: 32, d: "M15 25 H45 V55 H15 Z", box: [15,25,45,55] },
  { id: "R3", kind: "ring",   name: "Pocket floor ring", z: 24, d: "M15 25 H45 V55 H15 Z", box: [15,25,45,55] },
  { id: "R4", kind: "ring",   name: "Step face outline", z: 20, d: "M60 0 H120 V80 H60 Z", box: [60,0,120,80] },
  { id: "E1", kind: "edge",   name: "Step rim edge",     z: 32, d: "M60 0 V80", box: [60,0,60,80] },
  { id: "E2", kind: "edge",   name: "Step foot edge",    z: 20, d: "M60 0 V80", box: [60,0,60,80] },
  { id: "E3", kind: "edge",   name: "Left top edge",     z: 32, d: "M0 0 V80", box: [0,0,0,80] },
  { id: "E4", kind: "edge",   name: "Right step edge",   z: 20, d: "M120 0 V80", box: [120,0,120,80] },
  ...HOLES6.map(([x, y], i) => ({ id: "C" + String(i + 1).padStart(2, "0"), kind: "circle", name: "Hole", z: 20,
    dia: 6, c: [x, y], box: [x - 3, y - 3, x + 3, y + 3] })),
  { id: "C25", kind: "circle", name: "Hole", z: 20, dia: 10, c: HOLE10, box: [101,35,111,45] },
  { id: "P1", kind: "point",  name: "Corner",            z: 32, c: [0,0] },
  { id: "P2", kind: "point",  name: "Corner",            z: 32, c: [0,80] },
  { id: "P3", kind: "point",  name: "Step corner",       z: 32, c: [60,0] },
  { id: "P4", kind: "point",  name: "Step corner",       z: 32, c: [60,80] },
  { id: "P5", kind: "point",  name: "Step foot corner",  z: 20, c: [60,0] },
  { id: "P6", kind: "point",  name: "Step foot corner",  z: 20, c: [60,80] },
  { id: "P7", kind: "point",  name: "Corner",            z: 20, c: [120,0] },
  { id: "P8", kind: "point",  name: "Corner",            z: 20, c: [120,80] },
];
const BY_ID = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const KINDS = [["face", "Faces"], ["ring", "Face rings"], ["edge", "Edges"], ["circle", "Circles"], ["point", "Points"]];
const KIND_NOUN = { face: "face", ring: "face ring", edge: "edge", circle: "circle", point: "point" };
const PICK_ORDER = { point: 0, circle: 1, edge: 2, ring: 3, face: 4 };
const CAP = 8;

function label(it) {
  if (it.kind === "circle") return `Ø ${it.dia.toFixed(2)} at (${it.c[0]}, ${it.c[1]}) · Z ${it.z}`;
  return `${it.name} · Z ${it.z}`;
}
function plural(n, noun) { return `${n} ${noun}${n === 1 ? "" : "s"}`; }

/* ---------- The ops ----------
   serves: the kinds the op can cut (ItemUse). defaultKinds: the default rule on a STEP
   model (Q3: face rings; edges, circles and points enter by a pick or a rule). */
const OPS = [
  { id: "pocket",  name: "Pocket 1",  serves: ["face","ring","circle"], defaultKinds: ["ring"], floorOp: true,
    cut: [["Tool", "Ø 6 flat end mill"], ["Input", "stepped_block.step"], ["Stepover", "40 %"], ["Depth / pass", "2.0 mm"]] },
  { id: "profile", name: "Profile 1", serves: ["face","ring","circle"], defaultKinds: ["ring"], floorOp: true,
    cut: [["Tool", "Ø 6 flat end mill"], ["Input", "stepped_block.step"], ["Side", "Outside"], ["Depth / pass", "2.0 mm"]] },
  { id: "drill",   name: "Drill 1",   serves: ["circle","point"],       defaultKinds: [],       floorOp: false,
    cut: [["Tool", "Ø 6 drill"], ["Input", "stepped_block.step"], ["Cycle", "Peck"], ["Peck", "2.0 mm"]] },
  { id: "chamfer", name: "Chamfer 1", serves: ["ring","edge"],          defaultKinds: ["ring"], floorOp: false,
    cut: [["Tool", "90° V-bit"], ["Input", "stepped_block.step"], ["Width", "1.0 mm"]] },
];
const OP_BY_ID = Object.fromEntries(OPS.map(o => [o.id, o]));
const WHY_NOT = {
  pocket:  "Pocket cuts areas. It cannot cut an open edge or a point.",
  profile: "Profile cuts round areas. It cannot cut an open edge or a point.",
  drill:   "Drill cuts points and circles only.",
  chamfer: "Chamfer cuts face rings and edges only.",
};
const FLOOR_OP_TOP = "Op top, depth 6";
const FLOOR_EACH = "Each picked face, depth 0";

/* ---------- State ---------- */
const S = {
  hover: null,
  focusOp: "drill",
  tab: "geometry",
  pickOn: true,
  kindOn: new Set(KINDS.map(k => k[0])),
  filter: "",
  open: {},        // group key -> open (per op)
  shown: {},       // group key -> rows shown
  offersFor: null, // item id whose rule offers are open
  quiet: false,
  sel: {},
};
function freshSel() {
  return { isDefault: true, picks: new Set(), rules: [], floorMode: "op", floorFace: null, notes: [] };
}
function resetSel(opId) { S.sel[opId] = freshSel(); }
OPS.forEach(o => resetSel(o.id));

/* ---------- Selection logic ---------- */
function ruleKey(r) { return `${r.kind}|${r.by}|${r.value === undefined ? "" : r.value}`; }
function ruleMatches(r, it) {
  if (r.kind !== it.kind) return false;
  if (r.by === "dia") return it.dia === r.value;
  if (r.by === "z") return it.z === r.value;
  return true; // by kind
}
function ruleMembers(r) { return ITEMS.filter(it => ruleMatches(r, it)).map(it => it.id); }
function ruleText(r) {
  const noun = KIND_NOUN[r.kind] + "s";
  if (r.by === "dia") return `All circles Ø ${r.value.toFixed(2)} on this model`;
  if (r.by === "z") return r.kind === "face" ? `All up faces at Z ${r.value}` : `All ${noun} at Z ${r.value}`;
  return `All ${noun} on this model`;
}
function ruleOffers(it) {
  if (it.kind === "circle") return [{ kind: "circle", by: "dia", value: it.dia }, { kind: "circle", by: "kind" }];
  if (it.kind === "face") return [{ kind: "face", by: "z", value: it.z }];
  return [{ kind: it.kind, by: "z", value: it.z }, { kind: it.kind, by: "kind" }];
}
function defaultMembers(opId) {
  const op = OP_BY_ID[opId];
  return ITEMS.filter(it => op.defaultKinds.includes(it.kind) && op.serves.includes(it.kind)).map(it => it.id);
}
/* The members of an op, from the selection itself (not from the list model). */
function members(opId) {
  const s = S.sel[opId], out = new Set();
  if (s.isDefault) defaultMembers(opId).forEach(id => out.add(id));
  s.rules.forEach(r => ruleMembers(r).forEach(id => out.add(id)));
  s.picks.forEach(id => out.add(id));
  return out;
}
function coveringRule(opId, id) { return S.sel[opId].rules.find(r => ruleMatches(r, BY_ID[id])); }
function inside(a, b) {
  return a[0] >= b[0] - 1e-9 && a[1] >= b[1] - 1e-9 && a[2] <= b[2] + 1e-9 && a[3] <= b[3] + 1e-9 &&
    (a[0] > b[0] || a[1] > b[1] || a[2] < b[2] || a[3] < b[3]);
}
/* The state of an item for an op: off (kind not served), floor, cut, island, idle.
   Rings and circles nest by containment (a face keeps its own holes). */
function opState(opId, it, m) {
  const op = OP_BY_ID[opId], s = S.sel[opId];
  if (!op.serves.includes(it.kind)) return "off";
  if (s.floorFace === it.id && !(m || members(opId)).has(it.id)) return "floor";
  m = m || members(opId);
  if (!m.has(it.id)) return "idle";
  if ((it.kind === "ring" || it.kind === "circle") && op.id !== "chamfer") {
    let depth = 0;
    m.forEach(id => { const o = BY_ID[id]; if (id !== it.id && o.kind === "ring" && inside(it.box, o.box)) depth++; });
    if (depth % 2 === 1) return "island";
  }
  return "cut";
}
function opSummary(opId) {
  const m = members(opId), counts = {};
  let islands = 0;
  m.forEach(id => {
    const it = BY_ID[id], st = opState(opId, it, m);
    if (st === "island") { islands++; return; }
    counts[it.kind] = (counts[it.kind] || 0) + 1;
  });
  const parts = KINDS.filter(([k]) => counts[k]).map(([k]) => plural(counts[k], KIND_NOUN[k]));
  if (islands) parts.push(plural(islands, "island"));
  return parts.length ? parts.join(" · ") : "nothing";
}
function floorText(s) {
  if (s.floorMode === "face") return `A picked face: ${label(BY_ID[s.floorFace])}`;
  return s.floorMode === "each" ? FLOOR_EACH : FLOOR_OP_TOP;
}

/* ---------- Acts. Each act clears the old notes and writes its own. ---------- */
function note(s, cls, html) { s.notes.push({ cls, html }); }
function pick(opId, id) {
  const op = OP_BY_ID[opId], s = S.sel[opId], it = BY_ID[id];
  s.notes = [];
  if (!op.serves.includes(it.kind)) {
    note(s, "dan", `Refused: ${label(it)} is a ${KIND_NOUN[it.kind]}. ${WHY_NOT[opId]}`);
    return say(`<span class="dan">Refused. ${WHY_NOT[opId]}</span>`);
  }
  const r = coveringRule(opId, id);
  if (r) {
    note(s, "", `${label(it)} is in the rule "${ruleText(r)}". Remove the rule to drop it.`);
    return say("The item is already in a rule. Nothing changed.");
  }
  if (s.isDefault) {
    s.isDefault = false; s.picks = new Set([id]); s.rules = [];
    note(s, "", `The first pick replaced the default rule. ${op.name} cuts the picked items only.`);
    say(`The first pick replaces the default rule (O-PICK).`);
  } else if (s.picks.has(id)) {
    s.picks.delete(id); say(`Removed: ${label(it)}.`);
  } else {
    s.picks.add(id); say(`Added: ${label(it)}.`);
  }
  if (it.kind === "face" && op.floorOp && s.floorMode === "op" && s.picks.has(id)) {
    s.floorMode = "each";
    note(s, "cau", `The floor is now "${FLOOR_EACH}". Each face cuts to its own plane (Q2).`);
  }
  if (!members(opId).size) note(s, "cau", `${op.name} cuts nothing. Pick an item, or press Reset for the default rule.`);
}
function addRule(opId, rule) {
  const s = S.sel[opId];
  s.notes = [];
  const want = new Set(ruleMembers(rule));
  const holder = s.rules.find(r => [...want].every(id => ruleMatches(r, BY_ID[id])));
  if (holder) {
    note(s, "", `The rule "${ruleText(holder)}" already holds these items.`);
    return say("Nothing changed.");
  }

/* ---------- Self-check: each claim that the page makes ----------
   A. Every model item has one view element, and every view element is a model item.
   B. Keys without Z collide for the coincident pairs of DESIGN.md section 1.3.
   C. Every default rule takes kinds that its op can cut.
   D. The list length equals the selected count: each member is in exactly one group,
      and nothing else is.
   E. The default row count equals the default rule's members.
   F. A rule row's count equals its matches.
   G. The rendered list agrees with the list model (header count, group counts, rows are members).
   H. A scripted session (picks, a rule, a floor face, a refusal, Reset) keeps D-F true and
      gives the named results. */
function keyNoZ(it) {
  if (it.kind === "point") return `${it.kind}|${it.c}|0`;
  if (it.kind === "circle") return `${it.kind}|${it.c}|${it.dia}`;
  return `${it.kind}|${it.d}`;
}
function modelClaims(opId) {
  const errs = [], groups = listModel(opId), m = members(opId), seen = new Map();
  groups.forEach(g => g.ids.forEach(id => seen.set(id, (seen.get(id) || 0) + 1)));
  const total = groups.reduce((n, g) => n + g.ids.length, 0);
  if (total !== m.size) errs.push(`${opId}: list ${total} ≠ selected ${m.size}`);
  m.forEach(id => { if (seen.get(id) !== 1) errs.push(`${opId}: ${id} is in ${seen.get(id) || 0} groups`); });
  seen.forEach((n, id) => { if (!m.has(id)) errs.push(`${opId}: ${id} is listed but not selected`); });
  groups.forEach(g => {
    if (g.type === "default" && g.ids.length !== defaultMembers(opId).length) errs.push(`${opId}: default row count`);
    if (g.type === "rule" && g.ids.length !== ITEMS.filter(it => ruleMatches(g.rule, it)).length) errs.push(`${opId}: rule row count`);
  });
  return errs;
}
function domClaims() {
  const errs = [];
  if (S.tab !== "geometry") return errs;
  const opId = S.focusOp, m = members(opId), groups = listModel(opId);
  const cnt = document.getElementById("selCount");
  if (!cnt || +cnt.dataset.count !== m.size) errs.push("header count");
  const gRows = [...document.querySelectorAll("#glist [data-group]")];
  if (gRows.length !== groups.length) errs.push("group rows");
  gRows.forEach((r, i) => { if (!groups[i] || +r.dataset.gcount !== groups[i].ids.length) errs.push("group count " + r.dataset.group); });
  document.querySelectorAll("#glist [data-item]").forEach(r => { if (!m.has(r.dataset.item)) errs.push("row " + r.dataset.item + " is not selected"); });
  return errs;
}

  S.sel = {}; OPS.forEach(o => S.sel[o.id] = freshSel()); S.quiet = true;
  const expect = (cond, what) => { if (!cond) errs.push(what); };
  const all = () => OPS.forEach(o => errs.push(...modelClaims(o.id)));
  try {
    // Drill: default is empty, the first Ø6 pick replaces it, the rule takes all 24.
    expect(members("drill").size === 0, "drill default is empty");
    pick("drill", "C01"); all();
    expect(members("drill").size === 1 && !S.sel.drill.isDefault, "first pick replaces the default");
    addRule("drill", { kind: "circle", by: "dia", value: 6 }); all();
    expect(S.sel.drill.picks.size === 0 && members("drill").size === 24, "Ø6 rule holds 24 and replaces the pick");
    pick("drill", "C25"); all();
    expect(members("drill").size === 25, "a Ø10 pick adds one");
    pick("drill", "C02"); all();
    expect(members("drill").size === 25, "a pick in a rule changes nothing");
    addRule("drill", { kind: "circle", by: "kind" }); all();
    expect(S.sel.drill.rules.length === 1 && S.sel.drill.picks.size === 0 && members("drill").size === 25, "the circle rule replaces the Ø6 rule and the pick");
    // Profile: default is the 4 face rings; a face pick sets Each picked face; Use as floor.
    expect(members("profile").size === 4, "profile default is 4 face rings");
    pick("profile", "F1"); all();
    expect(S.sel.profile.floorMode === "each" && members("profile").size === 1, "Q2 on the first face pick");
    pick("profile", "F2"); useAsFloor("profile", "F2"); all();
    expect(S.sel.profile.floorMode === "face" && S.sel.profile.floorFace === "F2" && members("profile").size === 1, "Use as floor");
    // Pocket: a point is refused and the default stays.
    pick("pocket", "P1"); all();
    expect(S.sel.pocket.isDefault && members("pocket").size === 4 && S.sel.pocket.notes.some(n => n.cls === "dan"), "refusal keeps the default");
    // Chamfer: coincident edge pick, then Reset.
    pick("chamfer", "E1"); all();
    expect(members("chamfer").size === 1 && members("chamfer").has("E1") && !members("chamfer").has("E2"), "coincident pick takes one edge");
    reset("chamfer"); all();
    expect(S.sel.chamfer.isDefault && members("chamfer").size === 4, "Reset brings the default back");
  } finally { S.sel = saved; S.quiet = savedQuiet; }
  return errs;
}
const SCRIPT_ERRS = scripted();
function selfCheck() {
  const out = [];
  let fail = false;
  const line = (ok, good, bad) => { if (!ok) fail = true; out.push(ok ? "✓ " + good : `<span class="bad">✗ ${bad}</span>`); };
  const viewIds = [...svg.querySelectorAll("g.it")].map(g => g.dataset.id);
  line(viewIds.length === ITEMS.length && ITEMS.every(i => viewIds.filter(v => v === i.id).length === 1),
    `${ITEMS.length} model items, one view element each.`, "The model and the view disagree.");
  const seen = {}, pairs = [];
  ITEMS.filter(i => i.kind !== "face").forEach(i => { const k = keyNoZ(i); if (seen[k]) pairs.push(`${seen[k]}=${i.id}`); else seen[k] = i.id; });
  const want = ["R2=R3", "E1=E2", "P3=P5", "P4=P6"];
  line(want.every(p => pairs.includes(p)) && pairs.length === want.length,
    `Keys without Z collide: ${pairs.join(", ")}.`, `Collisions: ${pairs.join(", ")}`);
  line(OPS.every(o => o.defaultKinds.every(k => o.serves.includes(k))), "Default rules take served kinds.", "A default rule takes a kind that its op cannot cut.");
  const mErrs = []; OPS.forEach(o => mErrs.push(...modelClaims(o.id)));
  line(!mErrs.length, "List length = selected count; default and rule row counts = their members.", mErrs.join("; "));
  const dErrs = domClaims();
  line(!dErrs.length, "The shown list agrees with the model.", dErrs.join("; "));
  line(!SCRIPT_ERRS.length, "Scripted session (11 acts) passes.", "Script: " + SCRIPT_ERRS.join("; "));
  const f = document.getElementById("selfcheck");
  f.innerHTML = "Self-check: " + out.join("  ");
  f.dataset.result = fail ? "fail" : "pass";
}

say("Drill 1 uses its default rule, which takes nothing. Click a hole in the view.");
render();
