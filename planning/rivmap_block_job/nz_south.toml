# rs_cam two-sided job: RivMap oak block nz-south.
# GENERATED by planning/rivmap_block_job/derive.py. Do not edit; change the script.
# World frame = setup-1 frame = the back-view DXF frame (block_back.dxf):
#   x = 228.0 - X_block, y = Y_block + 313.0, z = T1 - Z_block, T1 = 25.5.
# Z datum MachineTable on every setup: Z0 = the spoilboard.
# Setup 1 emits world Z (back face at T1). Setup 3 (Bottom) emits local Z = block Z.
# XY zero (both setups): the stock-local (0, 0) corner, which the flip keeps in place;
#   it is (-5.0, -177.0) from pin 1.

format_version = 3

[job]
name = "rivmap nz-south block (two-sided)"

# Stock = block 253.0 x 338.0 + margins -X 16.0, +X 19.0, +-Y 8.0
# (-X: 2 x PIN_WALL 2.0 + pin 6.0 + outline tool 6.0; +X: + PIN_KEYING 3.0;
#  Y: outline tool + PIN_WALL). z = T1: the faced back thickness.
[job.stock]
x = 288.0
y = 354.0
z = 25.5
origin_x = -16.0
origin_y = -8.0
origin_z = 0.0
padding = 0.0
auto_from_model = false
flip_axis = "horizontal"

[job.stock.material.SolidWoodByJanka]
janka_lbf = 1290.0
label = "Oak (feeds_oak.toml janka_lbf)"
source_id = "rivmap feeds_oak.toml"

[[job.stock.alignment_pins]]
x = 5.0
y = 177.0
diameter = 6.0

[[job.stock.alignment_pins]]
x = 280.0
y = 177.0
diameter = 6.0

# safe_z = T1 + SAFE_Z_CLEARANCE_MM: a MachineTable datum does not shift the post Z (SAFEZ-LOCAL).
[job.post]
format = "grblhal"
spindle_speed = 10026
safe_z = 30.5
high_feedrate_mode = false
high_feedrate = 5000.0
spindle_strategy = "match_chart"

# resolution = map.toml [paths].grid (0.25)
[job.simulation]
resolution_mm = 0.25


# The machine: MachineProfile::shapeoko_vfd() (spindle 6000..24000 rpm, 1.5 kW;
# feeds_oak.toml says RPM 6000..24000) with MachineKinematics::shapeoko_xxl_ricky_tuned()
