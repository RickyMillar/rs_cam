# rs_cam two-sided job: the RivMap epoxy test piece (block/TESTPIECE.md).
# GENERATED by planning/rivmap_block_job/derive.py. Do not edit; change the script.
# The piece flips about its north-south line; rs_cam flips about a line parallel to
# machine X. World: x = Y_block + 60.0, y = X_block + 60.0, z = T1 - Z_block, T1 = 25.5.
# So: put the piece on the machine with NORTH TO THE RIGHT (+X), not to the back.
# Z datum MachineTable on every setup (Z0 = spoilboard).

format_version = 3

[job]
name = "rivmap epoxy test piece (two-sided)"

# testpiece.toml [block] stock_x x stock_y; z = T1 (the method).
[job.stock]
x = 120.0
y = 120.0
z = 25.5
origin_x = 0.0
origin_y = 0.0
origin_z = 0.0
padding = 0.0
auto_from_model = false
flip_axis = "horizontal"

[job.stock.material.SolidWoodByJanka]
janka_lbf = 1290.0
label = "Oak (feeds_oak.toml janka_lbf)"
source_id = "rivmap feeds_oak.toml"

[[job.stock.alignment_pins]]
x = 112.5
y = 60.0
diameter = 6.0

[[job.stock.alignment_pins]]
x = 7.5
y = 60.0
diameter = 6.0

[job.post]
format = "grblhal"
spindle_speed = 10026
safe_z = 30.5
high_feedrate_mode = false
high_feedrate = 5000.0
spindle_strategy = "match_chart"

# resolution = testpiece.toml [paths].grid
[job.simulation]
resolution_mm = 0.2


# The machine: MachineProfile::shapeoko_vfd() (spindle 6000..24000 rpm, 1.5 kW;
# feeds_oak.toml says RPM 6000..24000) with MachineKinematics::shapeoko_xxl_ricky_tuned()
# (the $$ capture: $120/$121/$122 = 500/500/270 mm/s2, $110/$111/$112 = 10000/10000/1000
# mm/min, $11 = 0.020). Source: crates/rs_cam_core/src/machine/{mod,kinematics}.rs.
[job.machine]
name = "Shapeoko XXL (1.5 kW VFD, $$ 2026-05-26)"
max_feed_mm_min = 10000.0
max_shank_mm = 7.0
aggressiveness = 0.85
[job.machine.spindle.Variable]
min_rpm = 6000.0
max_rpm = 24000.0
[job.machine.power.VfdConstantTorque]
rated_power_kw = 1.5
rated_rpm = 24000.0
[job.machine.chip_load]
k0 = 0.024
p = 0.61
q = 1.26
[job.machine.rigidity]
doc_roughing_factor = 0.25
doc_finishing_factor = 0.1
woc_roughing_factor = 0.8
woc_roughing_max_mm = 6.35
woc_finishing_mm = 0.635
adaptive_doc_factor = 2.0
adaptive_woc_factor = 0.25
[job.machine.kinematics]
acceleration_mm_s2 = 423.333333333
acceleration_xyz_mm_s2 = [500.0, 500.0, 270.0]
max_rate_xyz_mm_min = [10000.0, 10000.0, 1000.0]
junction_deviation_mm = 0.02


