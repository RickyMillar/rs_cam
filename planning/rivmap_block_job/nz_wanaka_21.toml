# rs_cam two-sided job: RivMap oak block nz-wanaka-21 (21 x 21 LEDs, block 358 x 443 x 25).
# GENERATED by planning/rivmap_block_job/derive_wanaka21.py from the block stage of 2026-10-31.
# World frame = setup-1 frame = the back-view DXF frame: x = 333.0 - X_block, y = Y_block + 418.0,
#   z = T1 - Z_block, T1 = 25.5. Z datum MachineTable on every setup: Z0 = the spoilboard.
# Stock 395.0 x 460.0 (the operator's), the block centred: 18.5 from each long edge,
#   8.5 from each short edge. XY zero: the stock corner, which the flip keeps in place.

format_version = 3

[job]
name = "rivmap nz-wanaka-21 block (two-sided)"

# The operator's stock 395.0 x 460.0, 26-27 thick (measure); the model is T1 = 25.5 thick
# (the back face pass starts at raw_top_max 27.0). The block is centred.
[job.stock]
x = 395.0
y = 460.0
z = 25.5
origin_x = -18.5
origin_y = -8.5
origin_z = 0.0
padding = 0.0
auto_from_model = false

[job.stock.material.SolidWood]
species = "WhiteOak"

[[job.stock.alignment_pins]]
x = 6.25
y = 230.0
diameter = 6.0

[[job.stock.alignment_pins]]
x = 388.75
y = 130.0
diameter = 6.0

[[job.stock.alignment_pins]]
x = 388.75
y = 330.0
diameter = 6.0

# safe_z = T1 + SAFE_Z_CLEARANCE_MM: a MachineTable datum does not shift the post Z.
[job.post]
format = "grblhal"
spindle_speed = 10610
safe_z = 30.5
high_feedrate_mode = false
high_feedrate = 5000.0
spindle_strategy = "match_chart"
controller_waits_for_spindle = true


# The machine: copied from testpiece_mini.toml (the operator's Scylla grblHAL $$ import).
[job.machine]
name = "Shapeoko Pro XXL (Scylla grblHAL, H100 1.5 kW VFD, $$ 2026-10-15)"
max_feed_mm_min = 15000.0
max_shank_mm = 7.0
aggressiveness = 0.85

[job.machine.spindle.Variable]
min_rpm = 6000.0
max_rpm = 24000.0

[job.machine.power.VfdConstantTorque]
rated_power_kw = 1.5
rated_rpm = 24000.0

[job.machine.chip_load]
k0 = 0.024
p = 0.61
q = 1.26

[job.machine.rigidity]
doc_roughing_factor = 0.25
doc_finishing_factor = 0.1
woc_roughing_factor = 0.8
woc_roughing_max_mm = 6.35
woc_finishing_mm = 0.635
adaptive_doc_factor = 2.0
adaptive_woc_factor = 0.25

[job.machine.kinematics]
acceleration_mm_s2 = 983.3333333333334
acceleration_xyz_mm_s2 = [
    1200.0,
    1200.0,
    550.0,
]
max_rate_xyz_mm_min = [
    15000.0,
    15000.0,
    2500.0,
]
junction_deviation_mm = 0.1

[job.machine.controller]
firmware = "grbl_hal"
rpm_max = 1000.0
rpm_min = 0.0
mode = 0
spindle_at_speed_tolerance_pct = 5.0
tool_change_mode = 3
tool_change_probing_distance_mm = 40.0
spindle_on_delay_s = 0.0

[job.machine.controller.spindle_drive]
plugin = "H-100 VFD"

# H1: the "Dust shoe" preset (planning/op_architecture_2026-10-14/PLAN.md,
# section H). The brush end is 25 mm above the bit end for normal work. The
# shoe travel range is not known, so it is not stated.
[job.machine.head]
name = "Dust shoe"
mount_mm = 0.0

[[job.machine.head.parts]]
