# rs_cam two-sided job: RivMap oak block nz-wanaka-21 (21 x 21 LEDs, block 358 x 443 x 25).
# GENERATED by planning/rivmap_block_job/derive_wanaka21.py from the block stage of 2026-10-31.
# World frame = setup-1 frame = the back-view DXF frame: x = 333.0 - X_block, y = Y_block + 418.0,
#   z = T1 - Z_block, T1 = 25.5. Z datum MachineTable on every setup: Z0 = the spoilboard.
# Stock 395.0 x 460.0 (the operator's), the block centred: 18.5 from each long edge,
#   8.5 from each short edge. XY zero: the stock corner, which the flip keeps in place.

format_version = 3

