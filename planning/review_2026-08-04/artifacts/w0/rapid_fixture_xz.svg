<text class="s" x="14" y="378">The test searches for a move landing exactly at (5,5,-3) and panics "cut1 endpoint not found" — that move no longer exists.</text>
<text class="s" x="14" y="394">The fixture asks the planner to cut 3.5 mm BELOW the finished surface while holding 0.5 mm of stock above it. That is self-contradictory under post-fa27b08 semantics.</text>
