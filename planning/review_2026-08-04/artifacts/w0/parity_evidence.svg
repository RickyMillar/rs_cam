<text x="24" y="904" style="font:11px monospace;fill:#333">On a flat mesh the nearest-cell heightmap lift and the exact drop-cutter drape agree, so parity is near-perfect.</text>
<text x="24" y="920" style="font:11px monospace;fill:#333">Curvature is what separates them. A broken stamping kernel would diverge on flat stock too; this does not.</text>
